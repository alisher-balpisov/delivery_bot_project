# ==============================================================================
# Project Metadata
# ==============================================================================
# Содержит основную информацию о вашем проекте
[project]
name = "delivery-bot"
version = "0.1.0"
description = "Telegram bot for delivery management system"
readme = "README.md"
requires-python = ">=3.13"

# Основные зависимости
dependencies = [
    "aiogram==3.22.0",
    "aiosqlite==0.21.0",
    "asyncpg==0.30.0",
    "python-dotenv==1.1.1",
    "fastapi==0.117.1",
    "greenlet==3.2.4",
    "httpx==0.28.1",
    "psutil==7.1.0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "redis==5.0.7",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.43",
    "uvicorn==0.37.0",
    "watchfiles==1.1.0",
    "aiodns>=3.6.1",
    "faker>=40.1.0",
    "pydantic-core==2.33.2",
    "httpcore==1.0.9",
    "limits==5.5.0",
    "aiofiles==24.1.0",
    "aiohttp==3.12.15",
    "aiohappyeyeballs==2.6.1",
    "aiosignal==1.4.0",
    "attrs==25.3.0",
    "frozenlist==1.7.0",
    "multidict==6.6.4",
    "propcache==0.3.2",
    "yarl==1.20.1",
    "click==8.3.0",
    "deprecated==1.2.18",
    "magic-filter==1.0.12",
    "wrapt==1.17.3",
    "h11==0.16.0",
    "anyio==4.11.0",
    "sniffio==1.3.1",
    "certifi==2025.8.3",
    "idna==3.10",
    "annotated-types==0.7.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.1",
    "starlette==0.48.0",
    "packaging==25.0",
    "iniconfig==2.1.0",
    "pluggy==1.6.0",
    "tqdm>=4.67.1",
]

# Зависимости, которые нужны только для разработки и тестирования
[project.optional-dependencies]
dev = [
    "icecream>=2.1.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

# Ссылки
[project.urls]
"Repository" = "https://github.com/alisher-balpisov/delivery_bot_project.git"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# B: flake8-bugbear
# S: flake8-bandit (security)
# UP: pyupgrade
# N: pep8-naming
# RUF: Ruff-specific rules
select = ["E", "F", "I", "B", "S", "UP", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore assert (S101) and hardcoded passwords (S105, S106) in tests
"tests/*" = ["S101", "S105", "S106"]
"backend/tests/*" = ["S101", "S105", "S106"]
