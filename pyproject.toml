# ==============================================================================
# Project Metadata
# ==============================================================================
# Содержит основную информацию о вашем проекте
[project]
name = "delivery-bot"
version = "0.1.0"
description = "Telegram bot for delivery management system"
readme = "README.md"
requires-python = ">=3.13"

# Основные зависимости
dependencies = [
    "aiogram>=3.22.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.116.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.7",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "watchfiles>=1.1.0",
]

# Зависимости, которые нужны только для разработки и тестирования
[project.optional-dependencies]
dev = [
    "icecream>=2.1.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

# Ссылки
[project.urls]
"Repository" = "https://github.com/alisher-balpisov/delivery_bot_project.git"
