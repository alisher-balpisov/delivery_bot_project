# ==============================================================================
# Project Metadata
# ==============================================================================
# Содержит основную информацию о вашем проекте
[project]
name = "delivery-bot"
version = "0.1.0"
description = "Telegram bot for delivery management system"
readme = "README.md"
requires-python = ">=3.13"

# Основные зависимости
dependencies = [
    "aiogram>=3.22.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.116.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "psutil>=7.0.0",
    "psycopg2-binary>=2.9.7",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "watchfiles>=1.1.0",
    "aiodns>=3.6.1",
    "faker>=40.1.0",
]

# Зависимости, которые нужны только для разработки и тестирования
[project.optional-dependencies]
dev = [
    "icecream>=2.1.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

# Ссылки
[project.urls]
"Repository" = "https://github.com/alisher-balpisov/delivery_bot_project.git"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort
# B: flake8-bugbear
# S: flake8-bandit (security)
# UP: pyupgrade
# N: pep8-naming
# RUF: Ruff-specific rules
select = ["E", "F", "I", "B", "S", "UP", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ignore assert (S101) and hardcoded passwords (S105, S106) in tests
"tests/*" = ["S101", "S105", "S106"]
"backend/tests/*" = ["S101", "S105", "S106"]
