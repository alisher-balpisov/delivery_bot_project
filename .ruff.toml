# Конфигурация Ruff
# Документация: https://docs.astral.sh/ruff/

# Python версия
target-version = "py313"

# Директории с исходным кодом
src = ["backend/src", "bot"]

# Максимальная длина строки
line-length = 100

# Встроенные функции (для icecream)
builtins = ["ic"]

# Исключаемые директории и файлы
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

[format]
# Стиль кавычек
quote-style = "double"

# Магическая висячая запятая
skip-magic-trailing-comma = false

# Форматирование docstrings
docstring-code-format = true

[lint]
# Правила линтера
select = [
    "E",   # pycodestyle (ошибки стиля)
    "W",   # pycodestyle (предупреждения стиля)
    "F",   # Pyflakes (логические ошибки, неиспользуемые импорты/переменные)
    "I",   # isort (сортировка импортов)
    "C4",  # flake8-comprehensions (улучшения для list/dict/set comprehensions)
    "B",   # flake8-bugbear (поиск вероятных багов и сомнительных паттернов)
    "C90", # mccabe (проверка цикломатической сложности)
    "UP",  # pyupgrade (модернизация синтаксиса до новой версии Python)
    "S",   # flake8-bandit (поиск уязвимостей безопасности)
    "RUF", # Специфичные правила Ruff
]

# Игнорируемые правила
ignore = [
    # pycodestyle
    "E501",  # Длина строки контролируется форматтером

    # flake8-bugbear
    "B008",  # Вызовы функций в качестве аргументов по умолчанию
    "B904",  # Raise without from

    # mccabe
    "C901",  # Контролируется через lint.mccabe.max-complexity

    # flake8-bandit
    "S101",  # Использование assert

    # Pyflakes
    "F403",  # Star imports
    "F405",  # Star imports

    # Ruff specific - Игнорировать для русских docstrings и комментариев
    "RUF001",  # Неоднозначные символы в строках (кириллица)
    "RUF002",  # Неоднозначные символы в docstrings (кириллица)
    "RUF003",  # Неоднозначные символы в комментариях (кириллица)
]

# Автоматические исправления
fixable = ["ALL"]

[lint.isort]
# Разбивать импорты с висячей запятой на отдельные строки
split-on-trailing-comma = false

[lint.mccabe]
# Максимальная цикломатическая сложность
max-complexity = 10

[lint.per-file-ignores]
# Тесты
"tests/*" = ["S101"]

# __init__.py
"__init__.py" = ["F401"]

# main.py
"backend/src/main.py" = ["E402"]
